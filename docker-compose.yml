services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marketforge-backend
    env_file: .env
    environment:
      PORT: 4000
      DATA_STORE: sqlite
      SQLITE_PATH: /app/database/marketforge.db
    volumes:
      - ./database:/app/database
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    container_name: marketforge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
